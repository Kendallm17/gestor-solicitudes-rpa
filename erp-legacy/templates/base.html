<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% block title %}ERP Contable{% endblock %}</title>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; background:#eef1f5; margin:0; color:#222; }
    header { background:#1f3a5f; color:#fff; padding:12px 24px; display:flex; justify-content:space-between; align-items:center; }
    header a { color:#cfe0ff; margin-left:16px; text-decoration:none; }
    main { max-width:760px; margin:24px auto; background:#fff; padding:24px; border:1px solid #c9d1dc; }
    label { display:block; margin-top:12px; font-weight:bold; }
    input, select, textarea { width:100%; padding:6px; box-sizing:border-box; border:1px solid #9aa7b8; }
    button { margin-top:16px; padding:8px 18px; background:#1f3a5f; color:#fff; border:0; cursor:pointer; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { border:1px solid #c9d1dc; padding:5px 8px; text-align:left; }
    th { background:#dfe6ef; }
    .msg { padding:8px 12px; margin-bottom:12px; }
    .error { background:#fde2e2; border:1px solid #e09a9a; }
    .ok { background:#e0f3e3; border:1px solid #8fc79a; }
  </style>
</head>
<body>
  <header>
    <strong>ERP Contable &middot; Módulo de reembolsos</strong>
    {% if session.user %}
    <nav>
      <a href="{{ url_for('nuevo') }}" id="nav-nuevo">Nuevo registro</a>
      <a href="{{ url_for('registros') }}" id="nav-registros">Registros</a>
      <a href="{{ url_for('logout') }}" id="nav-salir">Salir</a>
    </nav>
    {% endif %}
  </header>
  <main>
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensajes %}
        <div class="msg {{ categoria }}" id="mensaje-{{ categoria }}">{{ texto }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
