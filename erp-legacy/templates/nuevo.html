{% extends "base.html" %}
{% block title %}Nuevo registro · ERP Contable{% endblock %}
{% block content %}
<h2>Nuevo registro de reembolso</h2>
<form method="post" id="form-nuevo">
  <label for="id_solicitud">Id de solicitud (Dataverse)</label>
  <input type="text" id="id_solicitud" name="id_solicitud" value="{{ datos.id_solicitud }}">

  <label for="solicitante_email">Correo del solicitante</label>
  <input type="text" id="solicitante_email" name="solicitante_email" value="{{ datos.solicitante_email }}">

  <label for="categoria">Categoría</label>
  <select id="categoria" name="categoria">
    <option value="">-- Seleccione --</option>
    {% for c in categorias %}
    <option value="{{ c }}" {% if datos.categoria == c %}selected{% endif %}>{{ c }}</option>
    {% endfor %}
  </select>

  <label for="monto">Monto (CRC)</label>
  <input type="text" id="monto" name="monto" value="{{ datos.monto }}">

  <label for="descripcion">Descripción</label>
  <textarea id="descripcion" name="descripcion" rows="3">{{ datos.descripcion }}</textarea>

  <button type="submit" id="btn-guardar">Guardar registro</button>
</form>
{% endblock %}
